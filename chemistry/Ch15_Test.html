<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Chapter 15 Comprehensive Self-Test</title><style>:root{--a:#0b6b5b;--a2:#16a085;--bg:#eff6f4;--card:#fff;--ok:#1e8449;--bad:#c0392b;--gold:#b7950b}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.56;color:#203531;background:var(--bg);margin:0;padding:0 15px 95px}.wrap{max-width:1000px;margin:auto}header{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;padding:29px 28px;border-radius:0 0 15px 15px;margin:0 -15px 20px}header h1{margin:0 0 5px;font-size:1.6rem}header p{margin:0;opacity:.94}.how,.bridge{background:#e8f6f3;border-left:5px solid var(--a2);padding:12px 17px;border-radius:8px;margin:17px 0}.unit{background:#183f38;color:#fff;padding:10px 15px;border-radius:8px;margin:28px 0 12px;font-weight:760}.unit span{float:right;color:#a3e4d7;font-size:.82rem}section,.q{background:var(--card);border-radius:10px;padding:16px 20px;margin-bottom:16px;box-shadow:0 1px 5px #00000012}h2{color:var(--a);font-size:1.16rem;margin:0 0 10px}.num{background:var(--a);color:#fff;border-radius:6px;padding:2px 8px;font-size:.8rem;margin-right:8px}table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{border:1px solid #d2dfdc;padding:8px 10px;vertical-align:top;text-align:left}th{background:var(--a);color:#fff;font-size:.8rem;text-transform:uppercase}tr:nth-child(even) td{background:#f7fbfa}td:first-child{font-weight:700;color:#095647;width:20%}.f{font-family:Menlo,monospace;background:#e8f6f3;color:#075e50;padding:1px 5px;border-radius:4px}.hi{background:#fff1a8;padding:0 3px}.recipe{white-space:pre-wrap;background:#172d29;color:#ecf0f1;padding:15px 18px;border-radius:8px;font: .86rem/1.55 Menlo,monospace}.worked{background:#fef9e7;border-left:4px solid var(--gold);padding:10px 13px;border-radius:7px;margin-top:9px}.q{border-left:4px solid var(--a2)}.q.correct{border-left-color:var(--ok);background:#f2fbf5}.q.incorrect{border-left-color:var(--bad);background:#fdf3f2}.qhead{font-weight:760;color:var(--a)}.tag{float:right;background:#d1f2eb;border-radius:12px;padding:2px 9px;font-size:.7rem}.opts label{display:block;border:1px solid #d5dbdb;border-radius:7px;padding:7px 10px;margin:5px 0;cursor:pointer}.opts label:hover{background:#eafaf1}.fb,.ans{display:none;margin-top:10px;border-radius:7px;padding:10px 12px}.fb.show,.ans.show{display:block}.fb{background:#e8f6f3}.ans{background:#f5eef8;border-left:4px solid var(--ok)}button{font:inherit;font-weight:650;border:0;border-radius:8px;padding:8px 15px;cursor:pointer;background:var(--a);color:#fff}textarea{width:100%;min-height:78px;border:1px solid #aac7c0;border-radius:8px;padding:9px;font:inherit}.bar{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid #ccd;padding:10px;z-index:5}.barin{max-width:1000px;margin:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.ghost{background:#d5dbdb;color:#203531}.score{font-weight:700}.step{margin:5px 0}footer{text-align:center;color:#71827e;margin-top:28px}@media(max-width:700px){table{display:block;overflow-x:auto}.unit span{float:none;display:block}}@media print{.bar{display:none}body{background:#fff}}</style></head><body><div class="wrap"><header><h1>Chapter 15 — Comprehensive Self-Test</h1><p>50 questions · particle intuition, calculations, lab technique, and reactions</p></header><div class="how"><b>Use it diagnostically:</b> Answer without notes, submit for explanations, then retry only missed questions. Calculation distractors represent common setup errors.</div><div id="results"></div><form id="quiz"></form></div><div class="bar"><div class="barin"><span class="score" id="count"></span><button id="submit" type="button">Submit & Grade</button><button id="retry" class="ghost" type="button" style="display:none">Retry Wrong</button><button id="restart" class="ghost" type="button">Restart</button></div></div><script>const B=[["Vocabulary","A solution is…",["a homogeneous mixture","always a liquid","always water-based","a pure compound"],0,"Solutions may be solid, liquid, or gas."],["Vocabulary","The component normally present in the largest amount is the…",["solvent","solute","precipitate","electrolyte"],0,"The solvent generally determines solution phase."],["Vocabulary","The symbol (aq) means…",["dissolved in water","pure liquid","gas dissolved in any solvent","chemically bonded to water"],0,"Aqueous specifies water as solvent."],["Particles","NaCl(aq) is best pictured as…",["separated hydrated Na⁺ and Cl⁻ ions","intact NaCl molecules only","solid crystals floating unchanged","Na and Cl atoms"],0,"Soluble ionic compounds dissociate."],["Particles","Sugar dissolved in water is mainly present as…",["intact sugar molecules among water molecules","free carbon ions","sugar atoms","a new compound"],0,"Molecular dissolution need not break covalent molecules apart."],["Dissolving","Why does a “hole” need to form in solvent structure?",["solvent particles must separate to admit solute","the container expands","solute loses all mass","temperature must reach zero"],0,"Existing solvent–solvent attractions are disrupted."],["Dissolving","“Like dissolves like” primarily compares…",["intermolecular attraction compatibility","molar masses only","colors","physical size only"],0,"New solute–solvent attractions must compensate."],["Dissolving","Which pair is least likely to mix?",["CCl₄ and water","methanol and water","ammonia and water","N₂ and methane"],0,"CCl₄ is nonpolar while water is polar."],["Dissolving","Ethanol mixes with water largely because…",["its O–H group can hydrogen-bond","all carbon compounds are ionic","ethanol dissociates to ions","water is nonpolar"],0,"Its polar hydroxyl group interacts strongly."],["Dissolving","Oil remains separate from water because…",["oil–water attractions poorly replace water–water hydrogen bonds","oil is always denser","oil is a solid","water has no attractions"],0,"Polarity mismatch is the main idea."],["Saturation","A saturated solution…",["is at its solubility limit at stated conditions","must be very concentrated","contains no solvent","cannot contain undissolved solid"],0,"Saturation refers to the limit, not an absolute concentration."],["Saturation","A saturated solution of a poorly soluble substance may be…",["dilute","always concentrated","pure solute","impossible"],0,"Saturated and concentrated answer different questions."],["Saturation","In saturated solution with excess solid, the system is…",["in dynamic equilibrium","completely motionless","undergoing only crystallization","necessarily boiling"],0,"Dissolving and crystallizing continue at equal rates."],["Mass percent","Mass percent denominator is…",["mass of solution","mass of solvent","moles of solute","liters of solvent"],0,"Solution mass includes solute plus solvent."],["Mass percent","4.9 g glucose + 95.7 g water is approximately…",["4.9% glucose by mass","5.1%","0.049%","95.1%"],0,"4.9/(100.6)×100≈4.9%."],["Mass percent","12.0% as a decimal fraction is…",["0.120","12.0","0.0120","1200"],0,"Divide a percent by 100."],["Molarity","Molarity is…",["mol solute/L solution","g solute/L solvent","mol solvent/L solute","L/mol solution"],0,"M=mol/L solution."],["Molarity","1.00 mol in 125.0 mL solution equals…",["8.00 M","0.00800 M","0.125 M","125 M"],0,"125.0 mL=0.1250 L."],["Molarity","2.00 mol in a 10.0 M solution occupies…",["0.200 L","20.0 L","5.00 L","0.0200 L"],0,"V=n/M=0.200 L."],["Molarity","To find M from grams, first convert grams to…",["moles using molar mass","liters of solvent","percent directly","equivalents always"],0,"Molarity numerator is moles."],["Molarity","Molarity volume means…",["final solution volume","water added only","solute volume only","container capacity regardless of fill"],0,"This is a frequent preparation trap."],["Compare","At equal volumes, the higher-molarity solution has…",["more solute moles","fewer solute moles","the same moles always","no solvent"],0,"n=MV."],["Compare","At equal solute moles, the less concentrated solution has…",["greater volume","smaller volume","the same volume","zero volume"],0,"V=n/M."],["Ions","0.25 M CaCl₂ gives [Cl⁻]=…",["0.50 M","0.25 M","0.75 M","0.125 M"],0,"Two chloride ions per formula unit."],["Ions","0.20 M FeCl₃ gives ideal total ion concentration…",["0.80 M","0.60 M","0.20 M","1.00 M"],0,"One Fe³⁺ plus three Cl⁻ = four particles."],["Ions","0.10 M sucrose gives ion concentration approximately…",["0 M","0.10 M","1.20 M","12 M"],0,"Sucrose is a molecular nonelectrolyte."],["Ions","Which has most ion moles?",["300 mL 0.10 M CaCl₂","400 mL 0.10 M NaCl","200 mL 0.10 M FeCl₃","800 mL 0.10 M sucrose"],0,"CaCl₂: .300×.10×3=.090 mol ions; NaCl=.080; FeCl₃=.080; sucrose=0 ions."],["Standard solution","A standard solution has…",["accurately known concentration","maximum possible concentration","no solvent","unknown volume"],0,"Accuracy depends on quantitative preparation."],["Preparation","Correct final step after dissolving and transfer is…",["add solvent to calibration mark, then mix","add the flask volume of water","fill above mark then pour out","estimate volume in a beaker"],0,"Final solution volume must equal calibrated volume."],["Preparation","Why rinse transfer vessels into the volumetric flask?",["to transfer all measured solute quantitatively","to change molar mass","to reduce final volume","to create ions"],0,"Any material left behind lowers actual concentration."],["Preparation","Meniscus should be read…",["at eye level","from above","from below","after removing some solution"],0,"Eye-level reading avoids parallax."],["Dilution","Dilution changes…",["volume and concentration, not solute moles","solute moles only","molar mass","chemical identity"],0,"nbefore=nafter."],["Dilution","The dilution equation is…",["M₁V₁=M₂V₂","M₁/M₂=V₁/V₂ only when volumes equal","M₁+V₁=M₂+V₂","M=mass×volume"],0,"Both sides represent solute moles."],["Dilution","25.0 mL of 2.00 M diluted to 250.0 mL becomes…",["0.200 M","20.0 M","2.00 M","0.0200 M"],0,"M₂=2.00×25.0/250.0."],["Dilution","A true dilution should have…",["lower M and larger final V","higher M and smaller V","same M and V","more solute moles"],0,"It spreads same particles into more volume."],["Concentration change","Which decreases NaCl molarity?",["adding water","pouring out a well-mixed portion","evaporating water","adding NaCl"],0,"Only adding solvent lowers n/V here."],["Concentration change","Pouring out half of a homogeneous solution leaves molarity…",["unchanged","doubled","halved","zero"],0,"Solute and solution volume leave proportionally."],["Stoichiometry","First chemical step in solution stoichiometry is…",["write a balanced equation","multiply all volumes","assume 1:1","find density"],0,"Mole ratios must come from balanced chemistry."],["Stoichiometry","Moles in 20.0 mL of 0.200 M solution are…",["0.00400 mol","4.00 mol","0.0400 mol","0.000400 mol"],0,"0.0200 L×0.200 mol/L."],["Precipitation","Net ionic for lead phosphate is…",["3Pb²⁺+2PO₄³⁻→Pb₃(PO₄)₂(s)","Pb²⁺+PO₄³⁻→PbPO₄","2Pb²⁺+3PO₄³⁻→Pb₂(PO₄)₃","Pb+P+O→solid"],0,"Atoms and charge balance."],["Precipitation","0.0040 mol Pb²⁺ can form Pb₃(PO₄)₂ moles…",["0.0013 mol","0.0040 mol","0.012 mol","0.0020 mol"],0,"Divide by coefficient 3."],["Leftovers","Leftover ion concentration requires…",["moles remaining/total mixed volume","initial moles/initial volume always","product mass/volume","molar mass only"],0,"Subtract consumed material first."],["Spectator","A spectator ion after mixing…",["may be diluted even though it does not react","must precipitate","has zero concentration","changes element identity"],0,"Its moles persist but combined volume changes."],["Neutralization","Strong acid–strong base net ionic is…",["H⁺+OH⁻→H₂O","Na⁺+Cl⁻→NaCl(s)","H₂O→H₂+O₂","acid+base→nothing"],0,"Spectators cancel."],["Neutralization","1 mol H₂SO₄ can furnish for full neutralization…",["2 mol H⁺","1 mol H⁺","0.5 mol H⁺","4 mol H⁺"],0,"Two acidic hydrogens per formula unit in this context."],["Neutralization","0.500 mol H₂SO₄ needs NaOH moles…",["1.00 mol","0.500 mol","0.250 mol","2.00 mol"],0,"Two OH⁻ per mole acid."],["Equivalents","4 mol Ba(OH)₂ represents base equivalents…",["8 eq","4 eq","2 eq","16 eq"],0,"Each mole furnishes 2 mol OH⁻."],["Normality","Normality equals…",["equivalents per liter","moles per kilogram","grams per mole","liters per equivalent"],0,"N=eq/L."],["Normality","0.500 M H₂SO₄ is, for full neutralization…",["1.00 N","0.500 N","0.250 N","2.00 N"],0,"Multiply by 2 eq/mol."],["Normality","Unlike molarity, normality…",["depends on reaction capacity/context","never uses liters","is always smaller","cannot describe acids"],0,"Equivalent count depends on reaction role."]];let active=B.map((_,i)=>i),wrong=[];const qz=document.querySelector('#quiz');function render(ids){qz.innerHTML='';ids.forEach(i=>{const [s,q,o,a]=B[i],d=document.createElement('div');d.className='q';d.id='q'+i;d.innerHTML='<div class="qhead">Question '+(i+1)+'<span class="tag">'+s+'</span></div><p>'+q+'</p><div class="opts">'+o.map((x,j)=>'<label><input type="radio" name="x'+i+'" value="'+j+'"> '+x+'</label>').join('')+'</div><div class="fb" id="f'+i+'"></div>';qz.appendChild(d)});document.querySelector('#count').textContent='0 / '+ids.length+' graded';window.scrollTo(0,0)}function grade(){let ok=0;wrong=[];active.forEach(i=>{const d=document.querySelector('#q'+i),v=document.querySelector('input[name=x'+i+']:checked'),good=v&&+v.value===B[i][3];d.classList.add(good?'correct':'incorrect');if(good)ok++;else wrong.push(i);const f=document.querySelector('#f'+i);f.classList.add('show');f.innerHTML=(good?'✅ <b>Correct.</b> ':'❌ <b>Answer: '+B[i][2][B[i][3]]+'.</b> ')+B[i][4];d.querySelectorAll('input').forEach(x=>x.disabled=true)});document.querySelector('#count').textContent=ok+' / '+active.length+' correct ('+Math.round(ok/active.length*100)+'%)';document.querySelector('#retry').style.display=wrong.length?'inline-block':'none'}document.querySelector('#submit').onclick=grade;document.querySelector('#retry').onclick=()=>{active=[...wrong];render(active)};document.querySelector('#restart').onclick=()=>{active=B.map((_,i)=>i);render(active)};render(active);</script></body></html>
