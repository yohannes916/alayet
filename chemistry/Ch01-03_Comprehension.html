<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Chapters 1–3 Comprehension Challenge</title><style>:root{--a:#1a5276;--a2:#2e86c1;--bg:#f1f5f7;--card:#fff;--ok:#1e8449;--bad:#c0392b;--gold:#b7950b}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55;color:#21313c;background:var(--bg);margin:0;padding:0 15px 90px}.wrap{max-width:1000px;margin:auto}header{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;padding:28px;border-radius:0 0 14px 14px;margin:0 -15px 20px}header h1{margin:0 0 5px;font-size:1.6rem}header p{margin:0;opacity:.93}.how{background:#eaf2f8;border-left:5px solid var(--a2);padding:12px 17px;border-radius:8px;margin:16px 0 22px}.unit{background:#273746;color:#fff;padding:10px 15px;border-radius:8px;margin:28px 0 12px;font-weight:750;letter-spacing:.4px}.unit span{float:right;color:#aed6f1;font-size:.82rem}section,.q{background:var(--card);border-radius:10px;padding:16px 20px;margin-bottom:16px;box-shadow:0 1px 5px #00000012}h2{color:var(--a);font-size:1.15rem;margin:0 0 10px}.num{background:var(--a);color:#fff;border-radius:6px;padding:2px 8px;font-size:.8rem;margin-right:7px}table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{border:1px solid #d5dbdb;padding:8px 10px;vertical-align:top;text-align:left}th{background:var(--a);color:#fff;font-size:.8rem;text-transform:uppercase}tr:nth-child(even) td{background:#f8fbfd}td:first-child{font-weight:700;color:#154360;width:20%}.f{font-family:Menlo,monospace;background:#eaf2f8;color:#154360;padding:1px 5px;border-radius:4px}.hi{background:#fff3b8;padding:0 3px}.recipe{white-space:pre-wrap;background:#1b2631;color:#ecf0f1;padding:14px 17px;border-radius:8px;font-family:Menlo,monospace;font-size:.86rem}.worked{background:#fef9e7;border-left:4px solid var(--gold);padding:10px 13px;border-radius:7px;margin-top:9px}.q{border-left:4px solid var(--a2)}.q.correct{border-left-color:var(--ok);background:#f2fbf5}.q.incorrect{border-left-color:var(--bad);background:#fdf3f2}.qhead{font-weight:750;color:var(--a)}.tag{float:right;background:#d6eaf8;border-radius:12px;padding:2px 9px;font-size:.7rem}.opts label{display:block;border:1px solid #d5dbdb;border-radius:7px;padding:7px 10px;margin:5px 0;cursor:pointer}.opts label:hover{background:#eef6fa}.fb,.ans{display:none;margin-top:10px;border-radius:7px;padding:10px 12px}.fb.show,.ans.show{display:block}.fb{background:#eaf2f8}.ans{background:#f7f0fa;border-left:4px solid var(--ok)}button{font:inherit;font-weight:650;border:0;border-radius:8px;padding:8px 15px;cursor:pointer;background:var(--a);color:#fff}textarea{width:100%;min-height:75px;border:1px solid #b8c7ce;border-radius:8px;padding:9px;font:inherit}.bar{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid #ccd;padding:10px;z-index:5}.barin{max-width:1000px;margin:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.ghost{background:#d5dbdb;color:#24333d}.score{font-weight:700}.step{margin:5px 0}footer{text-align:center;color:#7f8c8d;margin-top:28px}@media(max-width:700px){table{display:block;overflow-x:auto}.unit span{float:none;display:block}}@media print{.bar{display:none}body{background:#fff}}</style></head><body><div class="wrap"><header><h1>Chapters 1–3 — Comprehension Challenge</h1><p>12 indirect, multi-step problems · detailed answers hidden individually</p></header><div class="how"><b>Do not reveal immediately:</b> write a complete explanation, including units and reasoning. Then compare with the worked answer and self-score honestly.</div><div id="quiz"></div></div><div class="bar"><div class="barin"><span class="score" id="score">Self-scored 0/12</span><button id="all" class="ghost">Reveal All</button></div></div><script>const Q=[["Scientific method · design","A student claims salt makes water boil faster. Design a fair test and distinguish observation, hypothesis, independent variable, dependent variable, controls, and the kind of result that would weaken the claim.","<div class=\"step\"><b>Observation/question:</b> perhaps salted water seemed to reach boiling sooner; the question is whether salt concentration changes time to boil under specified conditions.</div><div class=\"step\"><b>Hypothesis:</b> increasing salt concentration decreases time for a fixed water mass to reach a defined boiling condition. It is testable and directional.</div><div class=\"step\"><b>Independent variable:</b> salt concentration. <b>Dependent:</b> time and/or boiling temperature. Hold water mass, starting temperature, pot, burner power, pressure, thermometer placement, and definition of boiling constant.</div><div class=\"step\">Use a zero-salt control, several concentrations, repeated trials, and randomized order. If times overlap within uncertainty or increase with salt, the original claim is weakened. Note that “boils faster” could mean reaches boiling sooner or has a different boiling point—definitions matter.</div>"],["Precision · diagnose","Three balances give repeated masses: A: 10.01, 10.01, 10.02 g; B: 9.50, 10.50, 10.00 g. Accepted mass is 10.50 g. Compare accuracy and precision and identify a likely problem.","<div class=\"step\"><b>A:</b> tightly clustered → high precision, but about 0.49 g low → poor accuracy. A systematic calibration/zero error is plausible.</div><div class=\"step\"><b>B:</b> average is 10.00 g and readings scatter widely → poor precision and still inaccurate as a set, though one trial happens to equal the accepted value.</div><div class=\"step\">One lucky accurate result does not make a method precise or reliably accurate. Accuracy concerns agreement with truth; precision concerns reproducibility.</div>"],["Units · cubic trap","Convert 23.4 in³ to mL using 1 in=2.54 cm and 1 cm³=1 mL. Explain why multiplying by 2.54 only once is dimensionally wrong.","<div class=\"step\"><span class=\"f\">23.4 in³×(2.54 cm/1 in)³×(1 mL/1 cm³)</span></div><div class=\"step\">The in³ cancels only against in³ created by cubing the full factor. Numerically: 23.4×2.54³=383.4… → <b>383 mL</b> (3 sig figs).</div><div class=\"step\">Using 2.54 once leaves hidden incompatible dimensions; volume scales with the cube of length.</div>"],["Temperature · meaning","A sample warms from 20.0 °C to 40.0 °C. Did its Kelvin temperature double? Compute both Kelvin values and explain what actually doubled—or did not.","<div class=\"step\">20.0 °C=293.15 K; 40.0 °C=313.15 K. The Kelvin ratio is 313.15/293.15≈1.068, so absolute temperature rose about 6.8%, not doubled.</div><div class=\"step\">The Celsius number doubled only because Celsius has an arbitrary zero. Ratios of thermal temperature are physically meaningful on an absolute scale such as Kelvin.</div>"],["Sig figs · mixed operations","Evaluate (12.11 + 0.3) × 2.50 without rounding early. Show how the addition rule and multiplication rule interact.","<div class=\"step\">Inside parentheses: 12.11+0.3=12.41, but that sum is limited to the tenths place (conceptually 12.4). Keep 12.41 as a guard-digit value.</div><div class=\"step\">12.41×2.50=31.025. The sum's precision corresponds to 3 sig figs, and 2.50 has 3, so final = <b>31.0</b>.</div><div class=\"step\">Do not round the intermediate value on the calculator; track its limiting place, then round once.</div>"],["Density · displacement","Copper mass is 44.291 g. Water rises from 22.3 to 27.2 mL. Compute copper density with correct precision and identify which measurement limits the answer.","<div class=\"step\">Volume=27.2−22.3=<b>4.9 mL</b>; subtraction is limited to one decimal place.</div><div class=\"step\">d=44.291/4.9=9.039… g/mL. The displaced volume has only 2 significant figures, so report <b>9.0 g/mL</b>.</div><div class=\"step\">The balance provided many mass digits, but the graduated cylinder controls the final precision.</div>"],["Density · inverse reasoning","Two blocks have the same mass. Block X has twice the volume of block Y. Compare densities without choosing numbers, then predict which is more likely to sink in a given liquid.","<div class=\"step\">d=m/V. With equal m and VX=2VY, dX=m/(2VY)=½dY. X has half Y's density.</div><div class=\"step\">Relative to the same liquid, Y is more likely to sink because it is denser. Actual behavior still requires comparing each density to the liquid's density.</div>"],["Percent · reverse problem","The ocean mass is 1.8×10²¹ kg and HCO₃⁻ is 0.014% by mass. Find kilograms of HCO₃⁻ and explain the percent conversion.","<div class=\"step\">0.014%=0.014/100=<b>1.4×10⁻⁴</b>. Percent means parts per hundred, so division by 100 is required.</div><div class=\"step\">Mass=(1.4×10⁻⁴)(1.8×10²¹ kg)=3.24×10¹⁷ kg → <b>3.2×10¹⁷ kg</b> (2 sig figs).</div>"],["Matter · classify evidence","A colorless sample has fixed boiling point and cannot be separated by filtration or distillation. Electrolysis produces two gases. Classify the original and justify each rejected category.","<div class=\"step\">Fixed boiling behavior supports a <b>pure substance</b>. Failure of physical separation argues against a mixture.</div><div class=\"step\">Electrolysis chemically decomposes it into two substances, so it is a <b>compound</b>, not an element. An element cannot be decomposed by ordinary chemical means.</div><div class=\"step\">Colorlessness alone is irrelevant; the decisive evidence is fixed composition behavior plus chemical decomposition.</div>"],["Change · bubbles trap","Compare bubbles observed while water boils with bubbles observed after acid is added to a carbonate. Why is “bubbles formed” insufficient by itself?","<div class=\"step\">Boiling bubbles are water vapor: H₂O changes phase but keeps identity, so the change is physical.</div><div class=\"step\">Acid plus carbonate produces a new gas, commonly CO₂, along with other products: atoms rearrange, so it is chemical.</div><div class=\"step\">Bubbles only show gas present. Decide whether the gas is the original substance in a new phase or a newly formed substance; context and product identification matter.</div>"],["Dissolving · classification","Sugar disappears in water and can be recovered by evaporating the water. Is dissolution physical or chemical, and is the resulting liquid a compound or mixture?","<div class=\"step\">The sugar molecules remain chemically sugar and are recoverable by a physical method, so dissolution here is a <b>physical change</b>.</div><div class=\"step\">The solution has variable sugar-to-water ratio and its components are not chemically fixed, so it is a <b>homogeneous mixture</b>, not a compound.</div>"],["Separation · choose sequence","A mixture contains iron filings, sand, and dissolved salt in water. Propose a physical separation sequence and name the property used at each step.","<div class=\"step\">1) Use a magnet to remove iron: magnetic response differs. 2) Filter to retain sand: insoluble particle size differs. 3) Distill to collect water and leave salt, or evaporate/crystallize to recover salt: volatility differs.</div><div class=\"step\">Order matters: removing solids first prevents them from complicating later heating, while dissolved salt passes through ordinary filter paper.</div>"]],S={};const z=document.querySelector('#quiz');Q.forEach((x,i)=>{let d=document.createElement('div');d.className='q';d.innerHTML='<div class="qhead">Question '+(i+1)+'<span class="tag">'+x[0]+'</span></div><p>'+x[1]+'</p><textarea placeholder="Work through the reasoning here…"></textarea><p><button id="r'+i+'">Reveal Worked Answer</button></p><div class="ans" id="a'+i+'"><b>Worked answer</b>'+x[2]+'<p><button data-v="nailed" data-i="'+i+'">✓ Nailed</button> <button class="ghost" data-v="partial" data-i="'+i+'">~ Partial</button> <button class="ghost" data-v="missed" data-i="'+i+'">✗ Missed</button></p></div>';z.appendChild(d);document.querySelector('#r'+i).onclick=()=>{document.querySelector('#a'+i).classList.add('show');document.querySelector('#r'+i).disabled=true}});function upd(){let v=Object.values(S),n=v.filter(x=>x==='nailed').length,p=v.filter(x=>x==='partial').length,m=v.filter(x=>x==='missed').length;document.querySelector('#score').textContent='Self-scored '+v.length+'/'+Q.length+' · '+n+' nailed · '+p+' partial · '+m+' missed'}document.addEventListener('click',e=>{if(e.target.dataset.v){S[e.target.dataset.i]=e.target.dataset.v;upd()}});document.querySelector('#all').onclick=()=>Q.forEach((_,i)=>document.querySelector('#a'+i).classList.add('show'));</script></body></html>
