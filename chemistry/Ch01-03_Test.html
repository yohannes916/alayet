<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Chapters 1–3 Comprehensive Self-Test</title><style>:root{--a:#1a5276;--a2:#2e86c1;--bg:#f1f5f7;--card:#fff;--ok:#1e8449;--bad:#c0392b;--gold:#b7950b}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55;color:#21313c;background:var(--bg);margin:0;padding:0 15px 90px}.wrap{max-width:1000px;margin:auto}header{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;padding:28px;border-radius:0 0 14px 14px;margin:0 -15px 20px}header h1{margin:0 0 5px;font-size:1.6rem}header p{margin:0;opacity:.93}.how{background:#eaf2f8;border-left:5px solid var(--a2);padding:12px 17px;border-radius:8px;margin:16px 0 22px}.unit{background:#273746;color:#fff;padding:10px 15px;border-radius:8px;margin:28px 0 12px;font-weight:750;letter-spacing:.4px}.unit span{float:right;color:#aed6f1;font-size:.82rem}section,.q{background:var(--card);border-radius:10px;padding:16px 20px;margin-bottom:16px;box-shadow:0 1px 5px #00000012}h2{color:var(--a);font-size:1.15rem;margin:0 0 10px}.num{background:var(--a);color:#fff;border-radius:6px;padding:2px 8px;font-size:.8rem;margin-right:7px}table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{border:1px solid #d5dbdb;padding:8px 10px;vertical-align:top;text-align:left}th{background:var(--a);color:#fff;font-size:.8rem;text-transform:uppercase}tr:nth-child(even) td{background:#f8fbfd}td:first-child{font-weight:700;color:#154360;width:20%}.f{font-family:Menlo,monospace;background:#eaf2f8;color:#154360;padding:1px 5px;border-radius:4px}.hi{background:#fff3b8;padding:0 3px}.recipe{white-space:pre-wrap;background:#1b2631;color:#ecf0f1;padding:14px 17px;border-radius:8px;font-family:Menlo,monospace;font-size:.86rem}.worked{background:#fef9e7;border-left:4px solid var(--gold);padding:10px 13px;border-radius:7px;margin-top:9px}.q{border-left:4px solid var(--a2)}.q.correct{border-left-color:var(--ok);background:#f2fbf5}.q.incorrect{border-left-color:var(--bad);background:#fdf3f2}.qhead{font-weight:750;color:var(--a)}.tag{float:right;background:#d6eaf8;border-radius:12px;padding:2px 9px;font-size:.7rem}.opts label{display:block;border:1px solid #d5dbdb;border-radius:7px;padding:7px 10px;margin:5px 0;cursor:pointer}.opts label:hover{background:#eef6fa}.fb,.ans{display:none;margin-top:10px;border-radius:7px;padding:10px 12px}.fb.show,.ans.show{display:block}.fb{background:#eaf2f8}.ans{background:#f7f0fa;border-left:4px solid var(--ok)}button{font:inherit;font-weight:650;border:0;border-radius:8px;padding:8px 15px;cursor:pointer;background:var(--a);color:#fff}textarea{width:100%;min-height:75px;border:1px solid #b8c7ce;border-radius:8px;padding:9px;font:inherit}.bar{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid #ccd;padding:10px;z-index:5}.barin{max-width:1000px;margin:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.ghost{background:#d5dbdb;color:#24333d}.score{font-weight:700}.step{margin:5px 0}footer{text-align:center;color:#7f8c8d;margin-top:28px}@media(max-width:700px){table{display:block;overflow-x:auto}.unit span{float:none;display:block}}@media print{.bar{display:none}body{background:#fff}}</style></head><body><div class="wrap"><header><h1>Chapters 1–3 — Comprehensive Self-Test</h1><p>50 questions · auto-graded · explanations · retry wrong only</p></header><div class="how"><b>Use it diagnostically:</b> answer first without notes. Submit for explanations, then retry only missed items until every section is secure.</div><div id="results"></div><form id="quiz"></form></div><div class="bar"><div class="barin"><span class="score" id="count"></span><button id="submit" type="button">Submit & Grade</button><button id="retry" class="ghost" type="button" style="display:none">Retry Wrong</button><button id="restart" class="ghost" type="button">Restart</button></div></div><script>const B=[["Scientific method","A scientific theory is best described as…",["a broad, well-tested explanation supported by evidence","a guess that becomes a law","a description with no explanatory role","an opinion"],0,"Theory explains; law describes a relationship."],["Scientific method","Which is a testable hypothesis?",["Lower air pressure lowers water’s boiling point","Nature prefers round numbers","Chemistry is interesting","All observations are equally good"],0,"It predicts a measurable relationship that evidence could contradict."],["Experiment","The variable deliberately changed is the…",["independent variable","dependent variable","control result","constant"],0,"The dependent variable is measured in response."],["Measurement","Which is a complete measurement?",["12.4 mL","12.4","about twelve","mL"],0,"A measurement requires number and unit."],["Measurement","Repeated values tightly cluster away from the accepted value. They are…",["precise but inaccurate","accurate but imprecise","both accurate and precise","neither measurable nor useful"],0,"Tight clustering is precision; offset indicates inaccuracy."],["SI","The SI base unit for amount of substance is…",["mole","gram","liter","meter"],0,"The mole is the SI amount unit."],["Prefixes","1.00 km equals…",["1.00×10³ m","1.00×10⁻³ m","100 m","10⁶ m"],0,"kilo means 10³."],["Prefixes","A nanometer is…",["10⁻⁹ m","10⁹ m","10⁻⁶ m","10⁻³ m"],0,"nano = 10⁻⁹."],["Volume","1.00 mL is exactly equivalent in volume to…",["1.00 cm³","1.00 m³","1000 cm³","0.001 cm³"],0,"1 mL = 1 cm³."],["Volume","1 m³ equals…",["1000 L","100 L","1 L","10⁶ L"],0,"A cubic meter is 1000 liters."],["Mass/weight","An astronaut travels to the Moon. Which changes?",["weight changes; mass does not","mass changes; weight does not","both must increase","neither can be measured"],0,"Weight depends on gravitational field."],["Temperature","25.0 °C is…",["298.15 K","248.15 K","25.0 K","77.0 K"],0,"Add 273.15."],["Temperature","A 10 °C temperature increase equals…",["a 10 K increase","a 283 K increase","a 50 °F increase","absolute zero"],0,"Kelvin and Celsius intervals are equal-sized."],["Scientific notation","0.000004060 in scientific notation is…",["4.060×10⁻⁶","4.060×10⁶","4.06×10⁻⁵","4060×10⁻⁹"],0,"Move six places right; original sig figs are preserved."],["Scientific notation","(2.0×10³)(3.0×10⁻⁵)=",["6.0×10⁻²","6.0×10⁸","5.0×10⁻²","0.60×10⁻²"],0,"Multiply coefficients, add exponents, normalize."],["Sig figs","How many sig figs in 0.004080?",["4","3","6","2"],0,"Leading zeros do not count; captive and decimal trailing zeros do."],["Sig figs","How many sig figs in 150. as written?",["3","2","1","unlimited"],0,"The decimal point makes both trailing zeros explicit."],["Sig figs","Which value has unlimited significant figures?",["12 counted eggs","12.0 g","0.0120 L","a measured 12 cm"],0,"Counts are exact."],["Rounding","5.68 rounded to 2 sig figs is…",["5.7","5.6","5.68","6.0"],0,"The removed 8 rounds the 6 upward."],["Operations","1.342×5.5 should be reported as…",["7.4","7.381","7.38","7"],0,"Least factor has 2 sig figs."],["Operations","23.445+7.83 should be reported as…",["31.28","31.275","31.3","31"],0,"Addition uses 2 decimal places."],["Operations","Why keep guard digits?",["early rounding can accumulate error","calculators require them","units stop cancelling otherwise","they create exact values"],0,"Round once after the full calculation."],["Conversions","A conversion factor is numerically…",["equal to 1","equal to 0","always greater than 1","a measured uncertainty"],0,"Its numerator and denominator are equivalent quantities."],["Conversions","3.5 tsp×(5 mL/1 tsp)=",["18 mL","17.5 tsp","0.70 mL","18 tsp/mL"],0,"Units cancel; 17.5 rounds to 2 sig figs."],["Conversions","To convert in³ to cm³ using 1 in=2.54 cm, use…",["(2.54 cm/1 in)³","2.54 cm/1 in","3(2.54 cm/1 in)","(1 in/2.54 cm)"],0,"Cube the entire length factor."],["Conversions","45.8 mi/hr to km/s requires…",["converting both miles and hours","only converting miles","only converting hours","adding conversion factors"],0,"Rates carry independent numerator and denominator units."],["Density","Density equals…",["mass/volume","volume/mass","mass×volume","mass+volume"],0,"d=m/V."],["Density","4.30 g occupying 2.00 cm³ has density…",["2.15 g/cm³","0.465 g/cm³","8.60 g/cm³","2.2 cm³/g"],0,"4.30/2.00=2.15, 3 sig figs."],["Displacement","Water rises 22.3→27.2 mL. Object volume is…",["4.9 mL","49.5 mL","5.0 mL","27.2 mL"],0,"Subtract and retain one decimal place."],["Density","An object less dense than the surrounding liquid generally…",["floats","sinks","changes mass","becomes a gas"],0,"Buoyancy favors the less dense object at the surface."],["Percent","0.014% as a decimal fraction is…",["0.00014","0.014","0.0014","1.4"],0,"Divide percent by 100."],["Percent","78% of 5.2 L is…",["4.1 L","6.7 L","0.41 L","405.6 L"],0,"0.78×5.2=4.056→4.1 L."],["Matter","Which is matter?",["oxygen gas","light","heat","a magnetic field"],0,"Oxygen has mass and occupies space."],["States","Which has fixed volume but not fixed shape?",["liquid","solid","gas","energy"],0,"Liquids flow to container shape but retain volume."],["States","Which is most compressible?",["gas","liquid","solid","all equally"],0,"Gas particles have large empty spaces."],["Properties","Which is a physical property?",["density","flammability","tendency to rust","reactivity with acid"],0,"Density can be measured without changing identity."],["Properties","“Sugar can ferment” states a…",["chemical property","physical property","physical change","state of matter"],0,"It describes capacity to form new substances."],["Changes","Which is a physical change?",["crushing rock salt","burning wood","rusting iron","fermenting sugar"],0,"Particle size changes; composition does not."],["Changes","Which is a chemical change?",["electrolysis of water","freezing water","boiling water","melting ice"],0,"Water decomposes into H₂ and O₂."],["Evidence","Bubbles always prove a chemical reaction.",["False","True"],0,"Boiling also produces bubbles physically; context matters."],["Elements","Which is an element despite being molecular?",["O₂","H₂O","CO₂","NaOH"],0,"O₂ contains only oxygen atoms."],["Compounds","How many of H₂O, N₂O₄, NaOH, MnO₂, HF are compounds?",["5","4","3","2"],0,"Each contains at least two different elements in fixed ratios."],["Compounds","A compound has…",["fixed composition","variable composition","only one atom total","components separable by filtration"],0,"Pure compounds have fixed ratios."],["Mixtures","Which is a homogeneous mixture?",["gasoline","pure water","soil","jelly beans"],0,"Gasoline is a uniform blend; pure water is not a mixture."],["Mixtures","Which is heterogeneous?",["oil and vinegar","air","brass","saltwater"],0,"It has distinguishable phases/regions."],["Mixtures","Mixtures are separated primarily by…",["physical property differences","changing atomic nuclei","creating new elements","changing subscripts"],0,"Components retain identity."],["Separation","Best method to remove insoluble sand from water?",["filtration","distillation only","electrolysis","chemical decomposition"],0,"A filter retains particles while water passes."],["Separation","Best basis for distillation?",["different boiling tendencies","different colors only","different nuclear charges","chemical reaction"],0,"Distillation exploits volatility."],["Classification","A uniform sample with variable composition is a…",["homogeneous mixture","compound","element","heterogeneous pure substance"],0,"Uniform + variable composition defines a solution."],["Classification","If a material can be separated into components physically, it was…",["a mixture","necessarily a compound","an element","not matter"],0,"Physical separation is the defining mixture clue."]];let active=B.map((_,i)=>i),wrong=[];const qz=document.querySelector('#quiz');function render(ids){qz.innerHTML='';ids.forEach(i=>{const [s,q,o,a]=B[i],d=document.createElement('div');d.className='q';d.id='q'+i;d.innerHTML='<div class="qhead">Question '+(i+1)+'<span class="tag">'+s+'</span></div><p>'+q+'</p><div class="opts">'+o.map((x,j)=>'<label><input type="radio" name="x'+i+'" value="'+j+'"> '+x+'</label>').join('')+'</div><div class="fb" id="f'+i+'"></div>';qz.appendChild(d)});document.querySelector('#count').textContent='0 / '+ids.length+' graded';window.scrollTo(0,0)}function grade(){let ok=0;wrong=[];active.forEach(i=>{const d=document.querySelector('#q'+i),v=document.querySelector('input[name=x'+i+']:checked'),good=v&&+v.value===B[i][3];d.classList.add(good?'correct':'incorrect');if(good)ok++;else wrong.push(i);const f=document.querySelector('#f'+i);f.classList.add('show');f.innerHTML=(good?'✅ <b>Correct.</b> ':'❌ <b>Answer: '+B[i][2][B[i][3]]+'.</b> ')+B[i][4];d.querySelectorAll('input').forEach(x=>x.disabled=true)});document.querySelector('#count').textContent=ok+' / '+active.length+' correct ('+Math.round(ok/active.length*100)+'%)';document.querySelector('#retry').style.display=wrong.length?'inline-block':'none'}document.querySelector('#submit').onclick=grade;document.querySelector('#retry').onclick=()=>{active=[...wrong];render(active)};document.querySelector('#restart').onclick=()=>{active=B.map((_,i)=>i);render(active)};render(active);</script></body></html>
